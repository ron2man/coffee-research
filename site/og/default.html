<!doctype html>
<!-- Source for site/public/assets/og-default.png (1200×630) and logo-512.png.
     Regenerate: python3 site/og/render.py (needs Playwright and Chrome). -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Schibsted Grotesk"; src: url("../public/assets/fonts/schibsted-grotesk.woff2") format("woff2"); font-weight: 400 900; }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; background: #fff; color: #111; font-family: "Schibsted Grotesk", sans-serif; position: relative; overflow: hidden; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: #d92b22; }
.inner { position: absolute; inset: 72px 80px 100px; display: flex; flex-direction: column; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 22px; font: 800 52px/1 "Schibsted Grotesk"; letter-spacing: -.03em; }
.brand img { width: 76px; height: 76px; }
.b1 { color: #c4251d; } .b3 { font-weight: 500; }
h1 { font: 800 82px/1.02 "Schibsted Grotesk"; letter-spacing: -.035em; max-width: 980px; }
p { font: 400 34px/1.3 "Schibsted Grotesk"; color: #3f3f3c; }
</style></head><body>
<div class="inner">
  <div class="brand"><img src="../public/assets/icon.svg" alt=""><span><span class="b1">Your</span>Coffee<span class="b3">Setup</span></span></div>
  <div>
    <h1>Straight answers for home espresso.</h1>
    <p style="margin-top:22px">Fix it, upgrade it, or keep it. Including when to buy nothing.</p>
  </div>
</div>
<div class="bar"></div>
</body></html>
