<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today · Backoffice</title>
<link rel="stylesheet" href="/today.css">
<script type="module" src="/today.js"></script>
</head>
<body>
<header class="bar">
  <strong>Backoffice</strong>
  <nav><a href="#inbox">Today</a><a href="#articles">Articles</a><a href="#proposals">Proposals</a><a href="#seeds">Seeds</a><a href="#pipeline">Pipeline</a><a href="#feedback">Feedback</a><a href="#runs">Runs &amp; cost</a></nav>
  <button id="reload" type="button">Refresh</button>
</header>
<main>
  <p id="status" role="status">Loading…</p>
  <section id="scheduler" class="panel"></section>
  <section id="inbox" class="panel"><h2>Waiting for you</h2><div id="inbox-list"></div></section>
  <section id="articles" class="panel"><h2>Articles</h2><div id="article-list"></div></section>
  <section id="proposals" class="panel"><h2>Prompt proposals</h2><div id="proposal-list"></div></section>
  <section id="seeds" class="panel"><h2>Your topic seeds</h2>
    <form id="seed-form" class="row-form"><input name="text" placeholder="A question or situation readers have, e.g. I have a capsule machine and want better coffee" required><button type="submit">Add seed</button></form>
    <div id="seeds-list"></div></section>
  <section id="pipeline" class="panel"><h2>Pipeline</h2><div id="board" class="board"></div></section>
  <section id="feedback" class="panel"><h2>Feedback loop</h2><div id="feedback-list"></div></section>
  <section id="runs" class="panel"><h2>Runs and cost</h2><div id="costs"></div><h3>Agent runs: what they searched and read</h3><div id="agent-runs"></div><h3>Recent events</h3><div id="recent" class="table-wrap"></div></section>
</main>
<dialog id="article-dialog" aria-labelledby="article-title">
  <div class="dialog-head"><h2 id="article-title">Article</h2><button type="button" class="ghost" data-close>Close</button></div>
  <div id="article-body"></div>
</dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
